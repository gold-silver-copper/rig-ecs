lt","system_fingerprint":null,"usage":{"completion_tokens":338,"completion_tokens_details":{"audio_tokens":0,"image_tokens":0,"reasoning_tokens":52},"cost":0.00485975,"cost_details":{"upstream_inference_completions_cost":0.004732,"upstream_inference_cost":0.00485975,"upstream_inference_prompt_cost":0.00012775},"is_byok":false,"prompt_tokens":73,"prompt_tokens_details":{"audio_tokens":0,"cache_write_tokens":0,"cached_tokens":0,"video_tokens":0},"total_tokens":411}}'
