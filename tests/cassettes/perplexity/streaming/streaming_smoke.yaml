hin ...","source":"web","title":"What Is a Solar Eclipse","url":"https://www.timeanddate.com/eclipse/solar-eclipse.html"},{"date":"2024-03-01","last_updated":"2026-03-10","place_metadata":null,"snippet":"A solar eclipse occurs when the Moon passes between the Sun and the Earth and blocks the bright light of the Sun’s surface from view.\nThe shadow of the Moon will fall in a small path on Earth’s surface, called the zone of totality.","source":"web","title":"Solar Eclipses | National Air and Space Museum","url":"https://airandspace.si.edu/explore/stories/eclipse"},{"date":"2026-06-08","last_updated":"2026-07-04","place_metadata":null,"snippet":"An eclipse is an awe-inspiring celestial event that drastically changes the appearance of the two biggest objects we see in our sky: our Sun and Moon.\nOn Earth, people can experience solar and lunar eclipses when Earth, the Moon, and the Sun line up.\n...\nThere are four types of solar eclipses: Total...","source":"web","title":"Eclipses - NASA Science","url":"https://science.nasa.gov/eclipses/"},{"date":"2022-12-13","last_updated":"2026-07-14","place_metadata":null,"snippet":"A **solar eclipse** occurs when the Moon passes between the Sun and Earth, casting the Moon's shadow on Earth.\nA solar eclipse can only happen during a New Moon.","source":"web","title":"Solar and Lunar Eclipses - National Weather Service","url":"https://www.weather.gov/fsd/suneclipse"}],"usage":{"completion_tokens":10,"cost":{"input_tokens_cost":0,"output_tokens_cost":0,"total_cost":0},"prompt_tokens":24,"search_context_size":"low","total_tokens":34}}

