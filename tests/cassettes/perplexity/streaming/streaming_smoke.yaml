 eclipse is visible to anybody with...","source":"web","title":"ESA - What is an eclipse?","url":"https://www.esa.int/Science_Exploration/Space_Science/What_is_an_eclipse"},{"date":"2024-03-29","last_updated":"2026-07-13","place_metadata":null,"snippet":"A **solar eclipse** happens when, at just the right moment, the Moon passes between the Sun and Earth.\n...\nA solar eclipse happens when, at just the right moment, the Moon passes between the Sun and Earth.\n...\nAs the Moon blocks the Sun’s light, it casts a shadow on part of the Earth.","source":"web","title":"What Is a Solar Eclipse?","url":"https://spaceplace.nasa.gov/eclipse-snap/"},{"date":"2017-03-16","last_updated":"2026-05-13","place_metadata":null,"snippet":"A solar eclipse occurs when the moon “eclipses” the sun.\nThis means that the moon, as it orbits the Earth, comes in between the sun and the Earth, thereby blocking the sun and preventing any sunlight from reaching us.","source":"web","title":"What is a solar eclipse? - University Relations and Marketing","url":"https://communications.oregonstate.edu/space/osu150-space-grant-festival-total-eclipse-experience/what-solar-eclipse"},{"date":"2024-04-05","last_updated":"2026-05-17","place_metadata":null,"snippet":"{ts:57} A solar eclipse is a syzygy\nof the sun, moon, and Earth.\nIt occurs when the moon passes\nbetween the Earth and the sun, blocking all or part\nof the sun's light\n{ts:67} from reaching the Earth.\nThis happens only during a new\nmoon when all three are aligned and in the same path.","source":"web","title":"What Is a Solar Eclipse?","url":"https://www.youtube.com/watch?v=N3Pz2Dkt7YQ"},{"date":"2023-05-23","last_updated":"2025-11-10","place_metadata":null,"snippet":"A solar eclipse occurs when the Sun, Moon, and Earth align in such a way that the Moon passes in front of the Sun, partially or completely blocking its light from some parts of our planet.","source":"web","title":"What is a Solar Eclipse?","url":"https://www.unistellar.com/blog/what-is-solar-eclipse/"},{"date":"2026-05-13","last_updated":"2026-07-08","place_metadata":null,"snippet":"An eclipse occurs when one celestial body passes in front of another as seen from a third location — in other words, when three celestial bodies line up.\n...\nAs seen from Earth, a solar eclipse occurs when the Moon passes in front of the Sun.\n...\nSolar eclipses explained An eclipse is a celestial ev...","source":"web","title":"What Is a solar eclipse? Your questions answered.","url":"https://www.planetary.org/articles/solar-eclipse-guide"},{"date":"2001-10-18","last_updated":"2026-07-04","place_metadata":null,"snippet":"A **solar eclipse** occurs when the Moon passes between Earth and the Sun, thereby obscuring the view of the Sun from a small part of Earth, totally or partially.\nSuch an alignment occurs approximately every six months, during the eclipse season in its new moon phase, when the Moon's orbital plane i...","source":"web","title":"Solar eclipse","url":"https://en.wikipedia.org/wiki/Solar_eclipse"},{"date":"2021-04-23","last_updated":"2026-06-26","place_metadata":null,"snippet":"An eclipse takes place when a moon or a planet gets in the way of the sun’s light.\nWhen the planet or moon blocks the path of the sun, an eclipse takes place.\n...\nWhen the moon passes in front of the sun, resulting in the moon casting its shadow on the earth.\nIn this eclipse, the shadow from the moo...","source":"web","title":"What is Solar Eclipse? - BYJU'S","url":"https://byjus.com/physics/solar-eclipse/"},{"date":"2024-05-13","last_updated":"2026-07-13","place_metadata":null,"snippet":"An eclipse happens when any celestial body passes in front of another.\nFrom Earth, a solar eclipse occurs when the Moon passes between the Sun and Earth and either partially or completely blocks the Sun.\nAn even more precise term is an occultation; when a planet or moon moves across the face of anot...","source":"web","title":"Hybrid","url":"https://nso.edu/for-public/eclipse-science/"},{"date":"2025-09-26","last_updated":"2025-10-28","place_metadata":null,"snippet":"**solar eclipse**, the Moon coming between Earth and the Sun so that the Moon’s shadow sweeps over Earth’s surface.\nThis shadow consists of two parts: the umbra, a cone into which no direct sunlight penetrates; and the penumbra, which is reached by light from only a part of the Sun’s disk.\n...\nTo an...","source":"web","title":"Solar eclipse | Definition, Meaning, Diagram, & Types - Britannica","url":"https://www.britannica.com/science/solar-eclipse"},{"date":"2022-02-24","last_updated":"2026-07-14","place_metadata":null,"snippet":"Solar eclipses occur when the Sun, the Moon, and Earth line up, either fully or partially.\nDepending on how they align, eclipses provide a unique, exciting view of either the Sun or the Moon.\nA solar eclipse happens when the Moon passes between the Sun and Earth, casting a shadow on Earth that eithe...","source":"web","title":"Types of Solar Eclipses","url":"https://science.nasa.gov/eclipses/types/"},{"date":"2017-08-17","last_updated":"2026-07-11","place_metadata":null,"snippet":"{ts:1} - [Narrator] A solar eclipse happens when a new moon moves between\nthe Earth and the sun,\n{ts:6} blocking some or all of the sun's rays from reaching the Earth.\n...\nWhen the moon does eclipse the sun,\n{ts:45} it casts two types of shadows on Earth: a smaller, darker shadow,\nknown as the umbra...","source":"web","title":"Solar Eclipse 101 | National Geographic","url":"https://www.youtube.com/watch?v=cxrLRbkOwKs&vl=en"},{"date":null,"last_updated":"2026-03-17","place_metadata":null,"snippet":"A solar eclipse is a spectacular astronomical event.\nEach one is only visible from a limited area.\n...\nAn eclipse of the Sun happens when the New Moon moves between the Sun and Earth, blocking out the Sun's rays and casting a shadow on parts of Earth.\n...\nSolar eclipses are only visible from within ...","source":"web","title":"What Is a Solar Eclipse","url":"https://www.timeanddate.com/eclipse/solar-eclipse.html"},{"date":"2024-03-01","last_updated":"2026-03-10","place_metadata":null,"snippet":"A solar eclipse occurs when the Moon passes between the Sun and the Earth and blocks the bright light of the Sun’s surface from view.\nThe shadow of the Moon will fall in a small path on Earth’s surface, called the zone of totality.","source":"web","title":"Solar Eclipses | National Air and Space Museum","url":"https://airandspace.si.edu/explore/stories/eclipse"},{"date":"2026-06-08","last_updated":"2026-07-04","place_metadata":null,"snippet":"An eclipse is an awe-inspiring celestial event that drastically changes the appearance of the two biggest objects we see in our sky: our Sun and Moon.\nOn Earth, people can experience solar and lunar eclipses when Earth, the Moon, and the Sun line up.\n...\nThere are four types of solar eclipses: Total...","source":"web","title":"Eclipses - NASA Science","url":"https://science.nasa.gov/eclipses/"},{"date":"2022-12-13","last_updated":"2026-07-14","place_metadata":null,"snippet":"A **solar eclipse** occurs when the Moon passes between the Sun and Earth, casting the Moon's shadow on Earth.\nA solar eclipse can only happen during a New Moon.","source":"web","title":"Solar and Lunar Eclipses - National Weather Service","url":"https://www.weather.gov/fsd/suneclipse"}],"usage":{"completion_tokens":1,"cost":{"input_tokens_cost":0,"output_tokens_cost":0,"total_cost":0},"prompt_tokens":24,"search_context_size":"low","total_tokens":25}}

