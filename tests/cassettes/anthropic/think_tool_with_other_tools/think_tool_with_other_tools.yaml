  header:
  - name: content-type
    value: application/json
  body: '{"content":[{"text":"Here''s a full breakdown of everything you asked about:\n\n---\n\n### 💰 Refund for 1 Unit of Product A\nYou''ll receive a **$25.00 refund** for returning 1 unit of Product A. Per our policy, returns are accepted within **30 days with a receipt** for a full refund.\n\n---\n\n### 🔄 Exchange: Product B → Product C\nUnfortunately, **Product C is currently out of stock**, so we are unable to process the exchange of your 2 units of Product B for Product C at this time. You may want to check back later or consider an alternative product.\n\n---\n\n### 🚚 Express Shipping for Exchanged Items (Product C x2)\nShould Product C come back in stock, express shipping would cost **$15.99**.\n\n---\n\n### 🛒 Cost of Product A + 2x Product B with Standard Shipping\n| Item | Qty | Unit Price | Subtotal |\n|------|-----|------------|---------|\n| Product A | 1 | $25.00 | $25.00 |\n| Product B | 2 | $40.00 | $80.00 |\n| Standard Shipping | — | — | $5.99 |\n| **Total** | | | **$110.99** |\n\n---\n\n**Summary:**\n- ✅ **Refund:** $25.00 for 1x Product A\n- ❌ **Product C:** Out of stock — exchange cannot be fulfilled right now\n- 📦 **Express shipping (when available):** $15.99\n- 🛍️ **Product A + 2x Product B with standard shipping:** $110.99\n\nLet me know if there''s anything else I can help you with!","type":"text"}],"id":"msg_REDACTED_4","model":"claude-sonnet-4-6","role":"assistant","stop_details":null,"stop_reason":"end_turn","stop_sequence":null,"type":"message","usage":{"cache_creation":{"ephemeral_1h_input_tokens":0,"ephemeral_5m_input_tokens":0},"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"inference_geo":"global","input_tokens":1934,"output_tokens":412,"service_tier":"standard"}}'
